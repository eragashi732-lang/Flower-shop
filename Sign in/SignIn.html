<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <img src="../assets/img/photo-1588874133473-d6d9c9dd4f31 1.png" alt="">

        <form id="SignInForm">
            <h1>Sign In</h1>

            <input id="name" type="text" placeholder="name">
            <p id="nameError"></p>

            <input id="number" type="number" placeholder="phone number">
            <p id="numberError"></p>

            <input id="emailSignIn" type="email" placeholder="email">
            <p id="emailError"></p>

            <input id="passwordSignIn" type="password" placeholder="password">
            <p id="passwordError"></p>

            <p class="fSize12px">
                Have an account yet?
                <span><a href="../log in/logIn.html">Log in here.</a></span>
            </p>

            <button type="submit" class="customButton">LOG IN</button>
        </form>
    </main>

    <script>
        const nameRegex = /^[a-zA-Z\s]{3,}$/;
        const numberRegex = /^[0-9]{7,15}$/;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passwordRegex =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&._-])[A-Za-z\d@$!%*?&._-]{8,}$/;

        const form = document.getElementById("SignInForm");

        const nameInput = document.getElementById("name");
        const numberInput = document.getElementById("number");
        const emailInput = document.getElementById("emailSignIn");
        const passwordInput = document.getElementById("passwordSignIn");

        const nameError = document.getElementById("nameError");
        const numberError = document.getElementById("numberError");
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");

        // Clear errors while typing
        nameInput.addEventListener("input", () => nameError.textContent = "");
        numberInput.addEventListener("input", () => numberError.textContent = "");
        emailInput.addEventListener("input", () => emailError.textContent = "");
        passwordInput.addEventListener("input", () => passwordError.textContent = "");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            let valid = true;

            const name = nameInput.value.trim();
            const number = numberInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!nameRegex.test(name)) {
                nameError.textContent = "Name must be at least 3 letters.";
                nameError.style.color = "red";
                nameError.style.fontSize = "10px";
                valid = false;
            }

            if (!numberRegex.test(number)) {
                numberError.textContent = "Enter a valid phone number.";
                numberError.style.color = "red";
                numberError.style.fontSize = "10px";
                valid = false;
            }

            if (!emailRegex.test(email)) {
                emailError.textContent = "Please enter a valid email address.";
                emailError.style.color = "red";
                emailError.style.fontSize = "10px";
                valid = false;
            }

            if (!passwordRegex.test(password)) {
                passwordError.textContent =
                    "Password must be 8+ chars, uppercase, lowercase, number & symbol.";
                passwordError.style.color = "red";
                passwordError.style.fontSize = "10px";
                valid = false;
            }

            if (valid) {
                window.location.href = "../log in/logIn.html";
            }
        });
    </script>

</body>

</html>
